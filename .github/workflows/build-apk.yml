name: Build NTJHS IFP APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "build.gradle" ]; then
            gradle assembleDebug -Pandroid.useAndroidX=true --stacktrace
          else
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle" -exec dirname {} \;)
            echo "Building inside $SUBDIR"
            cd "$SUBDIR" && gradle assembleDebug -Pandroid.useAndroidX=true --stacktrace
          fi

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NTJHS-IFP-Receiver-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
